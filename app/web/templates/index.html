<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手術器械智能盤點系統</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- No CDN: the kiosk must render its core UI with no network at all. -->
</head>
<body>
  <div id="root">

    <!-- ── Header ───────────────────────────────────────────────────────
         Weighted by how often the operator touches it: the surgery type is
         the thing that changes between cases, the model package almost never
         does, and the tools are occasional. -->
    <header id="header">
      <div id="logo">
        <div id="logo-icon">囧</div>
        <span id="logo-text">手術器械盤點</span>
      </div>

      <!-- PRIMARY control — hidden for packages with a single fixed tray. -->
      <div id="surgery-bar" style="display:none">
        <label for="preset-select">手術類型</label>
        <select id="preset-select" onchange="onPresetChange(event)"></select>
        <span id="preset-meta"></span>
      </div>

      <!-- SECONDARY control — deliberately small; still fully functional. -->
      <div id="package-bar">
        <label for="package-select">模型</label>
        <select id="package-select" onchange="onPackageChange(event)"></select>
        <span id="package-status"></span>
      </div>

      <div id="toolbar">
        <button class="btn-tool" onclick="openHistory()" title="歷史記錄">&#9200; 歷史</button>
        <button class="btn-tool" onclick="downloadReport()" title="產生報告">&#9112; 報告</button>
        <button class="btn-tool danger" id="btn-shutdown" onclick="requestShutdown()"
                title="安全關機">⏻ 關機</button>
      </div>
    </header>

    <!-- ── Main ───────────────────────────────────────────────────────── -->
    <main id="main">

      <!-- Left: camera / image -->
      <section id="left-panel">
        <div id="image-area"
             ondragover="onDragOver(event)"
             ondragleave="onDragLeave(event)"
             ondrop="onDrop(event)">

          <div id="placeholder" class="visible">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none"
                 stroke="#9ca3af" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <p>拖放圖片至此或點擊上傳</p>
          </div>

          <img id="preview-img" alt="preview" style="display:none">
          <img id="camera-stream" alt="camera" style="display:none" onerror="_onStreamError()">
          <input type="file" id="file-input" accept="image/*" style="display:none"
                 onchange="onFileChange(event)">
        </div>

        <!-- Recognise is the action; the other two are setup. -->
        <div id="btn-row">
          <button class="btn-outline" id="btn-upload"
                  onclick="document.getElementById('file-input').click()">
            &#8679; 上傳
          </button>
          <button class="btn-outline" id="btn-camera" onclick="toggleCamera()">
            &#9676; 攝影機
          </button>
          <button class="btn-primary" id="btn-recognize" onclick="startRecognize()">
            &#9740; 開始辨識
          </button>
        </div>
      </section>

      <!-- Right: what is wrong, in the order the operator needs it -->
      <section id="right-panel">

        <!-- 1. Whole-tray verdict -->
        <div id="hero" class="hero-idle">
          <div id="hero-icon">…</div>
          <div id="hero-text">
            <div id="hero-title">尚未辨識</div>
            <div id="hero-detail">請開始辨識</div>
          </div>
        </div>

        <!-- 2. Exception counts, in units first -->
        <div id="summary-row">
          <div class="sum-card" id="sum-missing">
            <div class="sum-head"><span class="sum-icon">✕</span>缺少</div>
            <div class="sum-units" id="sum-missing-units">0</div>
            <div class="sum-classes" id="sum-missing-classes">0 類</div>
          </div>
          <div class="sum-card" id="sum-extra">
            <div class="sum-head"><span class="sum-icon">!</span>多出</div>
            <div class="sum-units" id="sum-extra-units">0</div>
            <div class="sum-classes" id="sum-extra-classes">0 類</div>
          </div>
          <div class="sum-chip" id="sum-normal">✓ 正常 <b id="sum-normal-classes">0</b> 類</div>
        </div>

        <!-- 3. Detail — exceptions first, normal folded away -->
        <div id="inventory">
          <div id="table-wrap">
            <table id="results-table">
              <colgroup>
                <col class="col-name">
                <col class="col-count">
                <col class="col-state">
              </colgroup>
              <thead>
                <tr>
                  <th>器械類別</th>
                  <th>盤點</th>
                  <th>狀態</th>
                </tr>
              </thead>
              <tbody id="results-tbody">
                <tr><td colspan="3" class="empty-row">尚無辨識結果</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 4. Weight — one card, never confusable with the tray verdict -->
        <div id="weight-card" class="wt-waiting">
          <div id="weight-icon">…</div>
          <div id="weight-text">
            <div id="weight-title">等待重量</div>
            <div id="weight-numbers">標準 —</div>
            <div id="weight-diff"></div>
          </div>
        </div>

        <div id="update-row">
          <span id="update-time">更新時間：—</span>
          <button class="btn-ghost small" onclick="manualRefresh()">&#8635; 刷新</button>
        </div>

      </section>
    </main>
  </div>

  <!-- ── History modal ─────────────────────────────────────────────────── -->
  <div id="history-modal" style="display:none">
    <div id="history-box">
      <div id="history-header">
        <span>歷史記錄</span>
        <button class="btn-ghost" onclick="closeHistory()">✕</button>
      </div>
      <div id="history-content">
        <table id="history-table">
          <thead>
            <tr><th>時間</th><th>來源</th><th>器械</th><th>重量(g)</th></tr>
          </thead>
          <tbody id="history-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
